name: Publish

# Publishes to npm with provenance when a GitHub Release is published.
# Requires the NPM_TOKEN secret (an npm automation/granular token with publish
# rights to @instantstudio). Provenance needs the id-token permission below and
# the repository field in package.json to match this repo.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
